# Python 3.12 backend installed via pip from requirements.txt.
# Regenerate locally with:
#   cd backend && uv export --no-dev --format requirements-txt -o requirements.txt

[phases.setup]
nixPkgs = ["python312", "gcc", "ffmpeg"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install --require-hashes -r requirements.txt",
]

[start]
cmd = "/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
