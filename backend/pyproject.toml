[project]
name = "multiverse-fm-backend"
version = "0.0.0"
description = "Multiverse FM — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "arq>=0.26",
  "redis>=5.1",
  "stripe>=10.0",
  "boto3>=1.35",
  "anthropic>=0.40",
  "elevenlabs>=1.0",
  "google-genai>=0.3",
  "openai>=1.50",
  "httpx>=0.27",
  "pydub>=0.25.1",
  "loguru>=0.7",
  "python-jose[cryptography]>=3.3",
  "cryptography>=43",
  "PyJWT[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.32",
  "respx>=0.21",
  "ruff>=0.7",
  "black>=24.10",
  "mypy>=1.13",
  "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RUF"]
ignore = ["S101"]  # allow asserts (pytest)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
