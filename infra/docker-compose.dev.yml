services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: multiverse
      POSTGRES_PASSWORD: multiverse
      POSTGRES_DB: multiverse
    ports:
      - "5433:5432"
    volumes:
      - mvfm_pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mvfm_pg_data:
